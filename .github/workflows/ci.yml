name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Get the K1 robot model (pinned booster_assets)
        run: scripts/setup_booster.sh assets

      - name: Install dependencies (dev group only, no torch)
        run: uv sync --locked

      - name: check the code
        run: uv run ruff check .

      - name: check formatting
        run: uv run ruff format --check

      - name: run tests
        run: uv run pytest
