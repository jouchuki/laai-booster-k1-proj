[project]
name = "laai-booster-k1-proj"
version = "0.1.0"
description = "Teaching the Booster K1 humanoid to ride a balance bike (sim-to-real RL)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.3",
    "numpy>=1.26,<3",
    "pyyaml",
    # K1 robot model; cloned by scripts/setup_booster.sh at a pinned commit.
    # Installed editable because it locates its files relative to its source folder.
    "booster-assets",
]

[dependency-groups]
# Run Booster's policies in the MuJoCo viewer on a Mac (booster_deploy needs these).
sim = [
    "torch",
    "scipy",
    "onnxruntime",
]
# Training with mjlab (Isaac Lab API on MuJoCo Warp). GPU training needs Linux + NVIDIA;
# CPU training also works with fewer environments (including headless CPU runs on macOS).
train = [
    "mjlab>=1.6",
    "numpy>=2,<3",
    "wandb",
]
# Booster's robot SDK (Python wrapper). Code that runs on the robot uses the robot's own runtime.
robot = [
    "boosteros[brain]>=1.2.3",
]
dev = [
    "pytest>=8",
    "ruff",
    "pre-commit",
]

[tool.uv]
default-groups = ["dev"]
# Booster's robot SDK requires NumPy <2; training uses NumPy 2.
# Install these workflows in separate environments.
conflicts = [
    [{ group = "train" }, { group = "robot" }],
]

[tool.uv.sources]
booster-assets = { path = "booster_assets", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k1bike"]

[tool.ruff]
line-length = 100
# runs/: task snapshots stay exactly as trained. force-exclude applies this list to files
# passed explicitly too (pre-commit passes renamed or edited files by name).
extend-exclude = ["booster", "booster_assets", "booster_deploy", "booster_train", "runs"]
force-exclude = true

[tool.ruff.lint.isort]
# Booster's checkouts may sit at the repository root (CI, setup_booster.sh) or under
# booster/; without this, ruff sorts their imports differently in the two layouts.
known-third-party = ["booster_assets", "booster_deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
